name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'web/docs/**'
      - 'ai/research/**'
      - '**/*.md'
      - 'ai/danMCai/models/experiments/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run format:check
      - run: npm run build
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install playwright==1.64.1
      - run: python -m playwright install --with-deps chromium
      - name: Browser smoke tests
        env:
          BROWSER_CHANNEL: chromium
        run: |
          node web/tools/serve.mjs > /tmp/guandan-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done
          python web/tests/production_smoke.py
          python web/tests/replay_security_smoke.py
          python web/tests/coach_smoke.py --solo-only
          python web/tests/control_layout_smoke.py --targeted
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: web/dist

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
